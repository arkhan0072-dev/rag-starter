[project]
name = "rag-starter"
version = "0.1.0"
description = "Production-style RAG API: hybrid search, reranking, cited answers and an evaluation harness"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abdulrehman Khan", email = "abdulrehmankhan0072@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pgvector>=0.3",
  "fastembed>=0.4",
  "pypdf>=5.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
