name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 2s
          --health-retries 30

    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache embedding and reranker models
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-${{ hashFiles('app/config.py') }}

      - run: pip install ".[dev]"

      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (fails below 95% coverage)
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=95

      - name: Retrieval evaluation
        run: |
          python -m eval.run_eval
          cat eval/results.md >> "$GITHUB_STEP_SUMMARY"
